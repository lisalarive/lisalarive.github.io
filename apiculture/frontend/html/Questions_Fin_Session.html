      <img src ="../img/Questions_Fin_Session/Rectangle 10.png"  alt="texte fin session">

    </div>

    <img  class="img_abeilles_themes_v_f" alt=" image d'abeille en fonction du thème" style="transform: translate(-50px, 20px);">

    <div class="boutton_revenir_aux_thèmes image-box-boutton" onclick="ajout_plus_un_nbr_sessions_complete();calcul_meilleur_score(); calcul_score_minimum(); ajout_bonne_reponse_au_score_moyen()">
      <a href="Themes.html" >
        <img src ="../img/Questions_Fin_Session/boutton_revenir_aux_thèmes.png"  alt="boutton_revenir_aux_thèmes">
      </a>
    </div>
    
    <script>
      let textefinsession = document.querySelector('p.texte_fin_session');
      if (textefinsession){
        let score_session = parseInt(localStorage.getItem('score_session'), 10)
        let texteAfficher =undefined;

        // entre 0 et 3
        if(score_session>=0 && score_session <=3){
          texteAfficher = 'La fabrication du miel demande de la patience.\nLes prochaines fleurs seront les bonnes !\nDéploie tes ailes et repart explorer le champs des connaissances '
        }
        //entre 4 et 7
        else if(score_session>=4 && score_session <=7){
          texteAfficher = "Continue de butiner avec cette belle énergie !\nLe nectar se transforme doucement en miel, plus qu'un petit coup d'ailes et tu seras au sommet de la ruche"
        }
        //entre 8 et 10
        else if(score_session>=8 && score_session <=10){
          texteAfficher = "Reine de la ruche !\nTon travail assidu et ta précision portent leurs fruits.\nC'est une récolte exceptionnelle, rempli de gelée royale"
        }
        //plus que 10
        else if(score_session > 10){
          texteAfficher= "Petit filou !\nTu as triché !!\nPS: Bravo à toi tu as trouvé le glitch ;) "
        }

        textefinsession.textContent = texteAfficher + '\nTon score : ' +score_session
      }

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === 'ArrowRight') {
          window.location.href = "Themes.html";
          ajout_plus_un_nbr_sessions_complete()
          calcul_meilleur_score()
          calcul_score_minimum()
          ajout_bonne_reponse_au_score_moyen()
        }
      });

    </script>
