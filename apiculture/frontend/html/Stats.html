    <div class="titre_tableau_score">
      <h2>L'Alvéole des Scores</h2>
    </div>
  <main class="page_stats">
    <div class="grille_score">
      <div class=" rectangle_beige">
        <img src="../img/Stats/icons8_finish-flag.png">
        <div class="groupe_texte">
          <span>Nombre de session terminée</span>
          <p class="nbr_session_finish"></p>
        </div>
      </div>

      <div class=" rectangle_beige">
        <img src="../img/Stats/2026_04_06_137_Kleki.png">
        <div class="groupe_texte">
          <span>Nombre de questions répondues</span>
          <p class="nbr_question_repondues"></p>
        </div>
      </div>

      <div class=" rectangle_beige">
        <img src="../img/Stats/noto_honey-pot.png">
        <div class="groupe_texte">
          <span>Meilleur score lors d'une session</span>
          <p class="meilleur_score"></p>
        </div>
      </div>

      <div class=" rectangle_beige">
        <img src="../img/Stats/iconamoon_trend-down.png">
        <div class="groupe_texte">
          <span>Score minimum lors d'une session</span>
          <p class="score_minimum"></p>
        </div>
      </div>


      <div class=" rectangle_marron">
        <img src="../img/Stats/gg_check-o.png">
        <div class="groupe_texte">
          <span>Nombre de réponse correcte</span>
          <p class="nbr_reponses_correctes"></p>
        </div>
      </div>

      <div class=" rectangle_marron">
        <img src="../img/Stats/carbon_chart-average.png">
        <div class="groupe_texte">
          <span>Score moyen par session</span>
          <p class="score_moyen"></p>
        </div>
      </div>
    </div>
