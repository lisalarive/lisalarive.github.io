    <script>
      function reponse_vrai_plus_un_score(){
        score_session= localStorage.getItem('score_session')
        console.log("score de la session : " + localStorage.getItem('score_session'));
        score_session++;
        localStorage.setItem('score_session',score_session);
        console.log("bonne réponse; score de la session après ajout +1 : " + localStorage.getItem('score_session'));
      }

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === 'ArrowRight') {
              reponse_vrai_plus_un_score()
              ajout_plus_un_nbr_bonne_reponses()
              ajout_num_question();
              
          }
      });

    </script>
