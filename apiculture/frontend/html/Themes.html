    <script>

      function commencer_session(nomDuTheme){

        //mettre thème en cache
        localStorage.setItem('choix_theme', nomDuTheme);
        console.log("Le joueur a choisi : " + nomDuTheme);

        //mettre score en cache
        localStorage.setItem('score_session',0);
        console.log("score de la session : " + localStorage.getItem('score_session'));

        //mettre numéro en cache
        localStorage.setItem('num_question',1);
        console.log("num de la question : " + localStorage.getItem('num_question'));

        localStorage.setItem('telechargement_autorise', 'oui');
      
        // permet de ne pas recharger plus d'une fois des questions lorsqu'on a démarre une session
        window.location.href = "Questions.html";
      }
      

    </script>
